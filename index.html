    <!-- Cinzel: an engraved-Roman-capital display face, chosen for the same
         reason the table itself has brass trim and a gold rail - carved/
         engraved gold lettering is this game's own material world, not a
         generic "casino wants an elegant serif" default. Used only for
         display voice (menu buttons, the loading label, section headings -
         see --heading in index.css); body copy stays on the system sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap"
    />
